<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050711" />
      <stop offset="50%" stop-color="#0a0f26" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <style type="text/css">
      <![CDATA[
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }

      @keyframes dataFlow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes cardFloat1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }

      @keyframes cardFloat2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(7px); }
      }

      @keyframes scanBeam {
        0% { transform: translateX(0px); opacity: 0; }
        20% { opacity: 0.9; }
        80% { opacity: 0.9; }
        100% { transform: translateX(1000px); opacity: 0; }
      }

      @keyframes borderGlow {
        0%, 100% { stroke-opacity: 0.35; }
        50% { stroke-opacity: 0.75; }
      }

      .pulse-orb-1 {
        animation: pulseGlow 6s ease-in-out infinite;
      }

      .pulse-orb-2 {
        animation: pulseGlow 7s ease-in-out infinite reverse;
      }

      .circuit-line {
        stroke-dasharray: 10, 6;
        animation: dataFlow 12s linear infinite;
      }

      .circuit-line-fast {
        stroke-dasharray: 8, 8;
        animation: dataFlow 8s linear infinite;
      }

      .float-card-1 {
        animation: cardFloat1 5s ease-in-out infinite;
      }

      .float-card-2 {
        animation: cardFloat2 6s ease-in-out infinite;
      }

      .scan-line {
        animation: scanBeam 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .animated-border {
        animation: borderGlow 4s ease-in-out infinite;
      }

      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 40px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }

      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 18px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }

      .pill-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #e2e8f0;
      }

      .node-text-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 11px;
        fill: #38bdf8;
      }

      .node-text-body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 11px;
        fill: #cbd5e1;
      }
      ]]>
    </style>
  </defs>

  <!-- Deep Canvas Base -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Atmosphere Glows -->
  <g id="ambient-lights">
    <circle cx="200" cy="120" r="280" fill="url(#cyanOrb)" class="pulse-orb-1" />
    <circle cx="1020" cy="280" r="300" fill="url(#purpleOrb)" class="pulse-orb-2" />
  </g>

  <!-- Cyber Grid Background Pattern -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="190" x2="1200" y2="190" />
    <line x1="0" y1="260" x2="1200" y2="260" />
    <line x1="0" y1="330" x2="1200" y2="330" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="550" y1="0" x2="550" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="850" y1="0" x2="850" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="1150" y1="0" x2="1150" y2="400" />
  </g>

  <!-- Dynamic Circuit / Telemetry Connection Lines (Midground) -->
  <g id="circuit-traces" opacity="0.4">
    <path d="M 60 200 L 220 200 L 290 120 L 450 120" fill="none" stroke="#38bdf8" stroke-width="1.8" class="circuit-line" />
    <path d="M 750 120 L 920 120 L 990 200 L 1140 200" fill="none" stroke="#818cf8" stroke-width="1.8" class="circuit-line" />
    <path d="M 120 340 L 320 340 L 390 280 L 510 280" fill="none" stroke="#c084fc" stroke-width="1.5" class="circuit-line-fast" />
    <path d="M 690 280 L 810 280 L 880 340 L 1080 340" fill="none" stroke="#38bdf8" stroke-width="1.5" class="circuit-line-fast" />
  </g>

  <!-- Left Dynamic Identity Verification Card (Flanked away from center text) -->
  <g class="float-card-1" transform="translate(60, 95)">
    <rect width="190" height="92" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="28" cy="28" r="10" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 24 28 L 27 31 L 32 25" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="46" y="27" class="node-text-title">AGENT CREDENTIAL</text>
    <text x="46" y="42" class="node-text-body">Ed25519 Verified ✓</text>
    <line x1="16" y1="56" x2="174" y2="56" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    <text x="16" y="74" class="node-text-body" fill="#94a3b8">Scope: MCP Tool Execution</text>
  </g>

  <!-- Right Dynamic Zero-Trust Policy Decision Card (Flanked away from center text) -->
  <g class="float-card-2" transform="translate(950, 95)">
    <rect width="190" height="92" rx="10" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="28" cy="28" r="10" fill="#7e22ce" fill-opacity="0.25" stroke="#c084fc" stroke-width="1.5" />
    <polygon points="28,21 34,25 34,31 28,35 22,31 22,25" fill="none" stroke="#c084fc" stroke-width="1.5" />
    <text x="46" y="27" class="node-text-title" fill="#c084fc">POLICY DECISION</text>
    <text x="46" y="42" class="node-text-body">TBAC / Least Privilege</text>
    <line x1="16" y1="56" x2="174" y2="56" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    <text x="16" y="74" class="node-text-body" fill="#94a3b8">Status: Scoped Token Active</text>
  </g>

  <!-- Sweeping Scanning Laser Beam Effect across bottom track -->
  <g opacity="0.6">
    <line x1="60" y1="365" x2="1140" y2="365" stroke="#1e293b" stroke-width="2" />
    <g class="scan-line">
      <line x1="60" y1="365" x2="160" y2="365" stroke="url(#neonGlow)" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- Top Accent Neon Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#neonGlow)" />

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="398" rx="15" fill="none" stroke="#38bdf8" stroke-width="1.5" class="animated-border" />

  <!-- FOREGROUND LAYER: Perfectly Legible, High Contrast, Never Hidden -->
  <g id="foreground">
    <!-- Category Kicker Pill -->
    <g transform="translate(600, 72)">
      <rect x="-180" y="-18" width="360" height="34" rx="17" fill="#0f172a" fill-opacity="0.95" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="-152" cy="-1" r="6" fill="#10b981" />
      <text x="0" y="4" text-anchor="middle" class="pill-text" fill="#38bdf8" letter-spacing="1.5">
        NON-HUMAN IDENTITY &amp; AGENTIC IAM
      </text>
    </g>

    <!-- Main Title with subtle shadow rect for contrast -->
    <text x="600" y="152" text-anchor="middle" class="title-text">
      Awesome Agent Identity &amp; IAM Systems
    </text>

    <!-- Subtitle -->
    <text x="600" y="196" text-anchor="middle" class="subtitle-text">
      The Curated Ecosystem for AI Agent Identity Verification, NHI &amp; Delegated Authorization
    </text>

    <!-- Category Pills Row (Foreground) -->
    <g transform="translate(600, 260)">
      <!-- Pill 1: AI Agents -->
      <g transform="translate(-400, 0)">
        <rect x="0" y="0" width="145" height="34" rx="8" fill="#0f172a" fill-opacity="0.95" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
        <text x="72" y="21" text-anchor="middle" class="pill-text">🤖 Autonomous Agents</text>
      </g>

      <!-- Pill 2: NHI -->
      <g transform="translate(-238, 0)">
        <rect x="0" y="0" width="155" height="34" rx="8" fill="#0f172a" fill-opacity="0.95" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
        <text x="77" y="21" text-anchor="middle" class="pill-text">🔐 Non-Human Identity</text>
      </g>

      <!-- Pill 3: Zero Trust -->
      <g transform="translate(-65, 0)">
        <rect x="0" y="0" width="130" height="34" rx="8" fill="#0f172a" fill-opacity="0.95" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4" />
        <text x="65" y="21" text-anchor="middle" class="pill-text">🛡️ Zero Trust</text>
      </g>

      <!-- Pill 4: OAuth 2.1 & DCR -->
      <g transform="translate(82, 0)">
        <rect x="0" y="0" width="155" height="34" rx="8" fill="#0f172a" fill-opacity="0.95" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
        <text x="77" y="21" text-anchor="middle" class="pill-text">⚡ OAuth 2.1 &amp; DCR</text>
      </g>

      <!-- Pill 5: Verifiable Credentials -->
      <g transform="translate(254, 0)">
        <rect x="0" y="0" width="150" height="34" rx="8" fill="#0f172a" fill-opacity="0.95" stroke="#34d399" stroke-width="1" stroke-opacity="0.4" />
        <text x="75" y="21" text-anchor="middle" class="pill-text">🪪 W3C DIDs &amp; VCs</text>
      </g>
    </g>

    <!-- Sub-footer status line -->
    <text x="600" y="330" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13px" fill="#64748b" font-weight="500">
      ⚡ Comprehensive Directory of SaaS Platforms &amp; Open-Source Projects • Updated for 2026
    </text>
  </g>
</svg>
